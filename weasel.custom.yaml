customization:
  distribution_code_name: Weasel          # 适配的Rime发行版：Windows平台Weasel
  distribution_version: 0.14.3            # Weasel版本号
  generator: "Weasel::UIStyleSettings"    # 配置生成器标识
  modified_time: "Tue Mar 31 17:56:14 2020"  # 配置最后修改时间
  rime_version: 1.5.3                     # Rime核心版本号
patch:
  menu:
    # 候选词个数
    page_size: 6
  style:
    color_scheme: Win10                   # 指定使用下方定义的Win10配色方案

  # win 10皮肤风格
  preset_color_schemes:
    Win10:
      author: "weijian.ye"                # 配色方案作者
      name: "Win10"                       # 配色方案名称
      candidate_text_color: 0x000000      # 普通候选词文字颜色（黑色）
      comment_text_color: 0x888888        # 候选词注释文字颜色（灰色）
      text_color: 0x000000                # 输入预编辑区文字颜色（黑色）
      back_color: 0xffffff                # 候选框整体背景色（白色）
      border_color: 0xcc8f29              # 候选框边框颜色（橙棕色）
      hilited_text_color: 0x000000        # 高亮预编辑区文字颜色（黑色）
      hilited_back_color: 0xffffff        # 高亮预编辑区背景色（白色）
      hilited_candidate_text_color: 0xffffff  # 选中候选词的文字颜色（白色）
      hilited_candidate_back_color: 0xcc8f29  # 选中候选词的背景色（橙棕色）
      hilited_comment_text_color: 0xffffff    # 选中候选词的注释文字颜色（白色）
      hilited_label_color: 0xffffff           # 选中候选词的序号颜色（白色）
      label_color: 0x888888                   # 普通候选词的序号颜色（灰色）
      label_format: "%s"                      # 序号显示格式（%s为序号占位符）
      candidate_format: "%c %@  "             # 候选词显示格式（%c=序号，%@=候选词，空格调整间隔）
      font_face: "Microsoft YaHei"            #字体
      font_point: 13                          #字体大小
      horizontal: true                        # 候选框布局方向（true=水平，false=垂直）
      inline_preedit: true                    # 预编辑文本是否内嵌显示（true=双行，false=单行）
      layout:
        border_width: 0                       # 候选框边框宽度（0=无边框）
        border: 0                             # 备用边框参数（无效，保留仅为兼容）
        margin_x: 12                          # 候选框左右外边距（像素）
        margin_y: 12                          #候选字上下边距
        hilite_padding: 12                    #候选字背景色色块高度 若想候选字背景色块无边界填充候选框，仅需其高度和候选字上下边距一致即可
        hilite_spacing: 3                     # 序号和候选字之间的间隔
        spacing: 10                           #作用不明
        candidate_spacing: 24                 # 候选字间隔
        round_corner: 0                       #候选字背景色块圆角幅度