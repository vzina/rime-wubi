customization:
  distribution_code_name: Squirrel
  distribution_version: 0.14.3
  generator: "Squirrel::UIStyleSettings"
  modified_time: "Tue Mar 31 17:56:14 2020"
  rime_version: 1.5.3

patch:
  # ===================== 全局样式核心配置（Rime 全版本兼容写法） =====================
  # 说明：采用 style/xxx 路径写法（patch 标准语法），兼容所有 Rime 版本
  style/color_scheme: mac                # 亮色模式启用的配色方案名称
  style/color_scheme_dark: mac_dark      # 暗黑模式启用的配色方案名称

  # 布局与排版
  style/candidate_list_layout: linear    # 候选词布局方式：linear=横向 / stacked=纵向
  style/text_orientation: horizontal     # 文字排列方向：horizontal=水平 / vertical=垂直
  style/candidate_format: "[label]. [candidate] [comment] \u200a"  # 候选词显示格式（序号. 候选词 注释 + 窄空格）

  # 状态与交互
  style/status_message_type: mix         # 状态栏消息类型：mix=混合 / long=完整 / short=精简
  style/memorize_size: true              # 候选框贴屏幕边缘时是否保持尺寸（粘性）

  # 字体配置
  style/font_face: "PingFang SC"         # 全局字体（候选词/序号/注释统一使用苹方）
  style/font_point: 18                   # 候选词基础字号
  style/label_font_point: 16             # 候选词序号字号
  style/comment_font_point: 16           # 候选词注释字号

  # 边框配置
  style/border_height: 0                 # 候选框上下边框高度
  style/border_width: 0                  # 候选框左右边框宽度

  # ===================== 预设配色方案 =====================
  preset_color_schemes:
    # macOS 亮色模式配色
    mac:
      name: macOS Light                  # 配色方案名称（显示用）
      back_color: 0xf1f2f2               # 候选框整体背景色（浅灰）
      label_color: 0x808080              # 未高亮候选词序号颜色（中灰）
      candidate_text_color: 0x494949     # 未高亮候选词文字颜色（深灰）
      comment_text_color: 0x494949       # 未高亮候选词注释颜色（深灰）
      hilited_candidate_back_color: 0xd85a00  # 高亮候选词背景色（橙红色）
      hilited_candidate_label_color: 0xffffff # 高亮候选词序号颜色（纯白）
      hilited_candidate_text_color: 0xffffff  # 高亮候选词文字颜色（纯白）
      hilited_comment_text_color: 0xffffff    # 高亮候选词注释颜色（纯白）

    # macOS 暗黑模式配色
    mac_dark:
      name: macOS Dark                   # 配色方案名称（显示用）
      back_color: 0x393939               # 候选框整体背景色（深灰）
      label_color: 0x7b7b7b              # 未高亮候选词序号颜色（浅灰）
      candidate_text_color: 0xebebeb     # 未高亮候选词文字颜色（近白）
      comment_text_color: 0xebebeb       # 未高亮候选词注释颜色（近白）
      hilited_candidate_back_color: 0xd15900  # 高亮候选词背景色（橙红色）
      hilited_candidate_label_color: 0xffffff # 高亮候选词序号颜色（纯白）
      hilited_candidate_text_color: 0xffffff  # 高亮候选词文字颜色（纯白）
      hilited_comment_text_color: 0xffffff    # 高亮候选词注释颜色（纯白）
